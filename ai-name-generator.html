<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Name Generator - Creative Custom Nicknames</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>AI Name Generator</h1>
        <p>Generate highly creative unique names driven algorithmically</p>
    </header>

    <main>
        <div class="ad-banner-slot">
            <span style="color: #666;">Advertisement Banner (728x90)</span>
        </div>

        <section class="generator-container">
            <div class="input-group">
                <label for="ai-keyword-input">Enter a keyword/theme:</label>
                <input type="text" id="ai-keyword-input" placeholder="e.g., Cyber, Shadow, Ninja...">
                <button id="btn-generate" class="btn-generate">Generate AI Names</button>
            </div>
        </section>

        <section id="output-grid" class="output-grid hidden"></section>
    </main>

    <div class="sticky-bottom-ad"><span style="color: #666;">Sticky Mobile Ad Bar Placeholder</span></div>
    <script src="script.js"></script>
</body>
</html>
