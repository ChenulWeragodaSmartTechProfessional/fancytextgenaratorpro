<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Fonts Generator - Change Bio & Caption Fonts</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Instagram Fonts Generator</h1>
        <p>Stand out on Instagram with cool fonts for your Bio and Captions</p>
    </header>

    <main>
        <div class="ad-banner-slot">
            <span style="color: #666;">Advertisement Banner (728x90)</span>
        </div>

        <section class="generator-container">
            <div class="input-group">
                <label for="insta-text-input">Type your Insta Bio/Caption text:</label>
                <input type="text" id="insta-text-input" placeholder="Write something stylish...">
                <button id="btn-generate" class="btn-generate">Generate Bio Fonts</button>
            </div>
        </section>

        <section id="output-grid" class="output-grid hidden"></section>
    </main>

    <div class="sticky-bottom-ad"><span style="color: #666;">Sticky Mobile Ad Bar Placeholder</span></div>
    <script src="script.js"></script>
</body>
</html>
