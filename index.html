<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fancy Text Generator Pro - Cool Fonts Copy & Paste</title>
    <link rel="stylesheet" href="style.css">
    
    </head>
<body>

    <header>
        <h1>Fancy Text Generator Pro</h1>
        <p>Convert your text into awesome fonts instantly</p>
    </header>

    <main>
        <div class="ad-banner-slot">
            <span style="color: #666;">Advertisement Banner (468x60)</span>
        </div>

        <section class="generator-container">
            <div class="input-group">
                <label for="main-text-input">Type your text below:</label>
                <input type="text" id="main-text-input" placeholder="Type or paste your text here...">
                <button id="btn-generate" class="btn-generate">Generate Fonts</button>
            </div>
        </section>

        <section id="output-grid" class="output-grid hidden"></section>
        
        <div class="ad-banner-slot" style="min-height: 150px;">
            <span style="color: #666;">Recommended Content (Native Banner)</span>
        </div>

        <div class="ad-banner-slot">
            <span style="color: #666;">Advertisement Banner (320x50)</span>
        </div>
    </main>

    <div class="side-ad-skyscrapper" style="position: fixed; right: 10px; top: 30%; z-index: 100;">
        </div>

    <div class="sticky-bottom-ad">
        <span style="color: #666;">Social Bar Active Zone</span>
    </div>

    <script src="script.js"></script>
</body>
</html>
