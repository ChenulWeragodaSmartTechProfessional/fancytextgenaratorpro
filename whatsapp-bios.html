<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Bio Generator - Creative About Statuses</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1>WhatsApp Bio Generator</h1>
        <p>Get unique status ideas and fonts for your WhatsApp profile</p>
    </header>

    <main>
        <div class="ad-banner-slot">
            <span style="color: #666;">Advertisement Banner (728x90)</span>
        </div>

        <section class="generator-container">
            <div class="input-group">
                <label for="wa-keyword-input">Enter a trait or hobby:</label>
                <input type="text" id="wa-keyword-input" placeholder="e.g., Gamer, Dreamer, Musician...">
                <button id="btn-generate" class="btn-generate">Generate Bio Ideas</button>
            </div>
        </section>

        <section id="output-grid" class="output-grid hidden"></section>
    </main>

    <div class="sticky-bottom-ad"><span style="color: #666;">Sticky Mobile Ad Bar Placeholder</span></div>
    <script src="js/script.js"></script>
</body>
</html>
